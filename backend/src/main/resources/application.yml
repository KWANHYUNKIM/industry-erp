spring:
  application:
    name: manufacturing-erp

  # 로컬 전용 설정(비밀값). 저장소에 없다(.gitignore) — 예시는 config/local.properties.example,
  # 공유 개발 서버는 qa/restart-backend.sh 가 처음 한 번 만들어 둔다. 운영은 이 파일 대신 환경변수로 준다.
  config:
    import: optional:file:./config/local.properties

  # 파일 업로드 상한. 서비스(FileStorageService.MAX_FILE_BYTES)도 같은 10MB 로 막지만,
  # 여기서 먼저 잘라야 큰 파일이 서버 메모리까지 올라오지 않는다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://localhost:5432/erp
    username: ${DB_USERNAME:erp}
    # 기본값 없음 — 환경변수 DB_PASSWORD. 로컬 개발(dev 프로필)은 application-dev.yml 이 docker-compose 의 개발 DB 값을 준다.
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # 스키마 변경은 전부 db/migration 의 V*.sql 로만 한다.
  # ddl-auto:update 는 데이터가 있는 테이블에 NOT NULL 컬럼을 추가할 때
  # WARN 만 남기고 조용히 실패하므로 더 이상 스키마 생성에 쓰지 않는다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 ddl-auto 로 만들어진 기존 DB는 V1 을 '적용됨'으로 표시만 하고 실행하지 않는다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: baseline from ddl-auto schema

  jpa:
    hibernate:
      ddl-auto: validate        # 엔티티와 실제 스키마가 어긋나면 기동 실패시켜 드리프트를 잡는다
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8081

# JWT 설정
app:
  jwt:
    # 서명 비밀 — 기본값이 없다(저장소가 공개라 코드에 적힌 값은 곧 공개 값). 환경변수 JWT_SECRET 또는 config/local.properties.
    # 없거나 32바이트 미만이면 기동을 멈춘다(dev 프로필만 임시 값으로 뜬다 — JwtTokenProvider).
    secret: ${JWT_SECRET:}
    # 토큰 유효기간 (밀리초): 8시간
    expiration-ms: 28800000
  # 주민등록번호 암호화 키(base64 32바이트) — 환경변수 ERP_PII_KEY 또는 config/local.properties. 기본값 없음(dev 만 평문으로 뜬다, PiiCipher).
  pii:
    key: ${ERP_PII_KEY:}

# 관측 — Actuator 는 health · info 만 웹에 연다(나머지 엔드포인트는 닫힘). health 는 세부(DB 등)를 안 보인다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# API 문서(/v3/api-docs) — 기본은 닫는다. dev 프로필만 연다(아래 문서). 열려도 로그인한 요청만 받는다(SecurityConfig anyRequest).
springdoc:
  api-docs:
    enabled: false

logging:
  # 줄마다 요청 id(RequestIdFilter → MDC requestId). 요청 밖(기동 · 스케줄러)은 빈 [].
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.SQL: info

---
# dev 프로필(./mvnw spring-boot:run · 공유 개발 서버) — API 문서를 연다. 운영(jar 실행)은 dev 가 아니라 닫힌 채다.
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
