# Bean Validation 기본 문구 (한국어)
#
# 제약에 message 를 안 적으면 Hibernate Validator 가 자기 기본 문구를 쓴다. 한국어 로케일에서는
# "널이어서는 안됩니다" 같은 번역이 그대로 화면에 나갔다. 실제로 품목 등록 실패 응답이
#   "널이어서는 안됩니다 품목분류를 선택하세요. 널이어서는 안됩니다"
# 였다 - 무엇을 고쳐야 하는지 알 수 없다.
#
# 이 파일은 표준 조회 순서상 Hibernate 기본값보다 먼저 읽히므로, message 를 안 적은 제약
# 76곳이 한꺼번에 이 문구를 쓴다. 개별 제약에 message 를 적으면 그쪽이 이긴다 - 어느 항목인지
# 이름까지 넣어 주려면 그렇게 한다.
#
# GlobalExceptionHandler 가 여기 있는 문구를 '일반 문구'로 알아보고 필드명을 앞에 붙인다.
# 문구를 고치면 그쪽 GENERIC 집합도 같이 고쳐야 한다.

jakarta.validation.constraints.NotNull.message=필수 항목입니다.
jakarta.validation.constraints.NotBlank.message=필수 항목입니다.
jakarta.validation.constraints.NotEmpty.message=하나 이상 입력하세요.
jakarta.validation.constraints.Positive.message=0보다 커야 합니다.
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다.
jakarta.validation.constraints.Negative.message=0보다 작아야 합니다.
jakarta.validation.constraints.NegativeOrZero.message=0 이하여야 합니다.
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다.
jakarta.validation.constraints.Max.message={value} 이하여야 합니다.
jakarta.validation.constraints.DecimalMin.message={value} 이상이어야 합니다.
jakarta.validation.constraints.DecimalMax.message={value} 이하여야 합니다.
jakarta.validation.constraints.Size.message={min}~{max}자여야 합니다.
jakarta.validation.constraints.Email.message=올바른 이메일 형식이 아닙니다.
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다.
jakarta.validation.constraints.Past.message=지난 날짜여야 합니다.
jakarta.validation.constraints.PastOrPresent.message=오늘 이전 날짜여야 합니다.
jakarta.validation.constraints.Future.message=앞으로의 날짜여야 합니다.
jakarta.validation.constraints.FutureOrPresent.message=오늘 이후 날짜여야 합니다.
jakarta.validation.constraints.AssertTrue.message=참이어야 합니다.
jakarta.validation.constraints.AssertFalse.message=거짓이어야 합니다.
jakarta.validation.constraints.Digits.message=정수 {integer}자리, 소수 {fraction}자리까지 입력하세요.
